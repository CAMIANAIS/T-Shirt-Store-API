openapi: 3.2.0
info:
  title: T-Shirt Store-OpenAPI
  version: 1.0.0
  description: |-
    This is first version of the contract for T-Shirt Store-OpenAPI. You can find out more about the patterns followed here https://github.com/CAMIANAIS/T-Shirt-Store-API/blob/main/docs/openApi_Patterns.md

    ## Authentication

    All endpoints require Bearer token authentication via JWT, except for the following public endpoints:
    - `POST /auth/signup` — Registration (can't have token yet)
    - `POST /auth/signin` — Login (can't have token yet)
    - `POST /auth/forgotpassword` — Password reset request (can't have token yet)
    - `POST /auth/resetpassword` — Password reset completion (can't have token yet)
    - `GET /products`, `GET /products/{productId}`, `GET /products/{productId}/variants`, `GET /products/{productId}/images`, `GET /categories` — Product/category browsing doesn't require authentication
    - `POST /webhooks/stripe` — Called by Stripe, not a user; authenticated via Stripe-Signature header instead of a bearer token

    Authentication failures return 401 (Authentication credentials invalid or missing) or 403 (insufficient permissions). The server reads the JWT role and automatically scopes results (regular users see only their own data; managers see all data).
servers:
  - url: http://localhost:3000
tags:
  - name: user
    summary: User account operations
    description: Operations about user management and authentication
  - name: product
    summary: Product operations
    description: Operations about products
  - name: cart
    summary: Cart operations
    description: Operations about cart
  - name: order
    summary: Order operations
    description: Operations about orders
  - name: productVariant
    summary: ProductVariant operations
    description: Operations about productVariant
  - name: category
    summary: Category operations
    description: Operations about categories
  - name: payment/webhook
    summary: Payment/webhook operations
    description: Operations about payment/webhook
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      required:
        - name
        - description
        - status
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: 'summer-tshirt'
        description:
          type: string
          example: 'long sleeves, 100% cotton'
        status:
          type: string
          enum:
            - active
            - inactive
            - discontinued
          example: 'active'
        category:
          $ref: '#/components/schemas/Category'
        createdAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        updatedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        deletedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
    Category:
      required:
        - name
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: 'tshirts'

        createdAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        updatedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        deletedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
    ProductVariant:
      required:
        - size
        - color
        - stockQuantity
        - skuCode
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        size:
          type: string
          enum:
            - 'S'
            - 'M'
            - 'L'
            - 'XL'
            - 'XXL'
          example: 'S'
        color:
          type: string
          example: 'red'
        stockQuantity:
          type: integer
          format: int64
          example: 1

        skuCode:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
          example: 'TSH-BLU-MD'
        status:
          type: string
          enum:
            - active
            - inactive
            - discontinued
        createdAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        updatedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        product:
          $ref: '#/components/schemas/Product'
    ProductVariantInput:
      required:
        - size
        - color
        - stockQuantity
        - skuCode
      type: object
      properties:
        size:
          type: string
          enum:
            - 'S'
            - 'M'
            - 'L'
            - 'XL'
            - 'XXL'
          example: 'S'
        color:
          type: string
          example: 'red'
        stockQuantity:
          type: integer
          format: int64
          example: 1

        skuCode:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
          example: 'TSH-BLU-MD'
        status:
          type: string
          enum:
            - active
            - inactive
            - discontinued
    ProductVariantUpdateInput:
      type: object
      properties:
        size:
          type: string
          enum:
            - 'S'
            - 'M'
            - 'L'
            - 'XL'
            - 'XXL'
          example: 'S'
        color:
          type: string
          example: 'red'
        stockQuantity:
          type: integer
          format: int64
          example: 1

        skuCode:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
          example: 'TSH-BLU-MD'
        status:
          type: string
          enum:
            - active
            - inactive
            - discontinued
    ProductImage:
      required:
        - bucketName
        - filename
        - extension
        - displayOrder
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        bucketName:
          type: string
          example: 'bucketNameHere'
        filename:
          type: string
          example: 'fileNameHere'
        extension:
          type: string
          enum:
            - 'jpg'
            - 'png'
            - 'webp'
            - 'gif'
          example: 'jpg'
        displayOrder:
          type: integer
          format: int64
          example: 1
        altText:
          type: string
          example: 'Product front view'
        createdAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        updatedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        product:
          $ref: '#/components/schemas/Product'
    ProductImageInput:
      required:
        - file
      type: object
      properties:
        file:
          type: string
          format: binary
          description: 'Raw image file bytes. Supported formats: jpg, png, webp, gif'
        displayOrder:
          type: integer
          format: int64
          example: 1
        altText:
          type: string
          example: 'Product front view'
    ProductInput:
      required:
        - name
        - description
        - status
      type: object
      properties:
        name:
          type: string
          example: 'summer-tshirt'
        description:
          type: string
          example: 'long sleeves, 100% cotton'
        status:
          type: string
          enum:
            - active
            - inactive
            - discontinued
          example: 'active'
        categoryId:
          type: integer
          description: Set a category for this product
          example: 1
        variants:
          type: array
          description: Optional variants to create alongside the product in one call
          items:
            $ref: '#/components/schemas/ProductVariantInput'
    ProductUpdateInput:
      type: object
      properties:
        name:
          type: string
          example: 'summer-tshirt'
        description:
          type: string
          example: 'long sleeves, 100% cotton'
        status:
          type: string
          enum:
            - active
            - inactive
            - discontinued
          example: 'active'
        categoryId:
          type: integer
          description: Set a category for this product
          example: 1
    LineItem:
      required:
        - id
        - productVariantId
        - quantity
        - priceAtPurchase
        - subtotal
      type: object
      properties:
        id:
          type: integer
          example: 1
        productVariantId:
          type: integer
          example: 42
        quantity:
          type: integer
          example: 2
          minimum: 1
        priceAtPurchase:
          type: integer
          format: int64
          example: 2999
          description: Price per unit in cents (locked at purchase)
        subtotal:
          type: integer
          format: int64
          example: 5998
          description: quantity × price_at_purchase (calculated)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Cart:
      required:
        - items
        - userId
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        items:
          type: array
          items: { '$ref': '#/components/schemas/LineItem' }
        createdAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        updatedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        userId:
          type: integer
    Order:
      required:
        - items
        - totalAmount
        - status
        - paymentMethod
        - userId
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        items:
          type: array
          items: { '$ref': '#/components/schemas/LineItem' }
        totalAmount:
          type: integer
          format: int64
          example: 1000
          description: Amount in cents (e.g., 1000 = $10.00)
          minimum: 0
        status:
          type: string
          enum:
            - pending
            - paid
            - processing
            - shipped
            - cancelled
            - delivered
          example: 'pending'
        paymentMethod:
          type: string
          enum: [payment_link, payment_intent]
          example: 'payment_intent'
        createdAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        updatedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        userId:
          type: integer
    CartItemsInput:
      required:
        - productVariantId
        - quantity
      type: object
      properties:
        productVariantId:
          type: integer
        quantity:
          type: integer
    CartItemsInputById:
      required:
        - quantity
      type: object
      properties:
        quantity:
          type: integer
          example: 1
    OrderInput:
      required:
        - shippingAddress
      type: object
      properties:
        shippingAddress:
          $ref: '#/components/schemas/OrderAddressInput'
    OrderAddressInput:
      required:
        - street1
        - street2
        - city
        - postalCode
        - state
        - country
      type: object
      properties:
        street1:
          type: string
          example: '123 Main St'
        street2:
          type: string
          example: 'Apt 4B'
        street3:
          type: string
        city:
          type: string
          example: 'New York'
        postalCode:
          type: string
          example: '10001'
        state:
          type: string
          example: 'NY'
        country:
          type: string
          example: 'USA'
    PaymentIntentInput:
      required:
        - paymentMethod
      type: object
      properties:
        paymentMethod:
          type: string
          enum: [card, bank_account, apple_pay, google_pay]
          example: 'card'
    OrderStatusInput:
      required:
        - status
      type: object
      properties:
        status:
          type: string
          description: >-
            Only these two transitions are accepted via this endpoint
            (paid -> processing -> shipped). Cancellation has its own
            dedicated endpoint (POST /orders/{orderId}/cancel); pending/paid/
            delivered are never valid input here, only output states.
          enum:
            - processing
            - shipped
          example: 'processing'
    OrderStatusHistory:
      required:
        - status
        - changedAt
        - changedBy
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - paid
            - processing
            - shipped
            - cancelled
            - delivered
          example: 'processing'
        changedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        changedBy:
          oneOf:
            - $ref: '#/components/schemas/ChangedByUser'
            - $ref: '#/components/schemas/ChangedBySystem'
          discriminator:
            propertyName: type
            mapping:
              user: '#/components/schemas/ChangedByUser'
              system: '#/components/schemas/ChangedBySystem'
    User:
      required:
        - id
        - email
        - username
        - role
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: 'jhon@example.com'
        username:
          type: string
          example: 'jhon'
        role:
          type: string
          enum: [manager, client]
        createdAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        updatedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
        deletedAt:
          type: string
          format: date-time
          example: '1985-04-12T23:20:50.52Z'
    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            birthdate:
              type: string
              format: date
              example: '1998-04-12'
    AuthResponse:
      required:
        - user
        - token
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT bearer token for subsequent requests
    UserInput:
      required:
        - username
        - email
        - password
      type: object
      properties:
        username:
          type: string
          example: 'jhon'
        email:
          type: string
          format: email
          example: 'jhon@example.com'
        password:
          type: string
          format: password
        birthdate:
          type: string
          format: date
          example: '1998-04-12'
    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: 'Product not found'
        error:
          type: string
          example: 'Not Found'
    ChangedByUser:
      type: object
      required:
        - type
        - email
      properties:
        type:
          type: string
          enum: [user]
        email:
          type: string
          format: email
          description: Immutable email snapshot at time of change
        userId:
          type: integer
          format: int64
          nullable: true
          description: User ID if account still exists; null if deleted
    ChangedBySystem:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [system]
security:
  - bearerAuth: []
paths:
  /products/{productId}:
    get:
      tags:
        - product
      summary: Find product by identifier
      description: Returns a single product.
      operationId: getProductById
      parameters:
        - name: productId
          in: path
          description: ID of product to return
          required: true
          schema:
            type: integer
            format: int64
      security: []
      responses:
        '200':
          description: Product successfully returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
            application/xml:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid productId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        'default':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - product
      summary: Update product
      description: Updates any field of a product
      operationId: updateProductItem
      parameters:
        - name: productId
          in: path
          description: ID of the product to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Update the product
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
        required: true
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
            application/xml:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid productId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication credentials invalid or missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        'default':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - product
      summary: Soft Delete a product
      description: Removes a product using a logical delete.
      operationId: removeProduct
      parameters:
        - name: productId
          in: path
          description: ID of product to remove
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Item removed successfully
        '400':
          description: Invalid productId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication credentials invalid or missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        'default':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories:
    get:
      tags:
        - category
      summary: Get all categories
      description: Returns a list of all product categories for browsing and filtering
      operationId: getCategories
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
            description: Show categories considering this limit
            example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            description: Show categories considering this offset
            example: 0
      security: []
      responses:
        '200':
          description: Categories successfully returned
          headers:
            X-TotalCount:
              description: Total number of categories
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '422':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        'default':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products:
    get:
      tags:
        - product
      summary: Get all products
      description: Returns a list of products
      operationId: getProducts
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            description: Filter products by category id
            example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
            description: Show products considering this limit
            example: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            description: Show products considering this offset
            example: 1
      security: []
      responses:
        '200':
          description: Products successfully returned
          headers:
            X-TotalCount:
              description: Total number of products matching the applied filters
              schema:
                type: integer
          content:
            application/json:
              schema:
                {
                  'type': 'array',
                  'items': { '$ref': '#/components/schemas/Product' },
                }
            application/xml:
              schema:
                {
                  'type': 'array',
                  'items': { '$ref': '#/components/schemas/Product' },
                }
        '422':
          description: Invalid category or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        'default':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - product
      summary: Add a new product.
      description: Add a new product.
      operationId: addProduct
      requestBody:
        description: Create a new product in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/ProductInput'
        required: true
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
            application/xml:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication credentials invalid or missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        'default':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productId}/variants:
    get:
      tags:
        - productVariant
      summary: Find productVariants by identifier
      description: Returns productVariants.
      operationId: getProductVariants
      parameters:
        - name: productId
          in: path
          description: ID of product to return
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
            description: Show productVariants considering this limit
            example: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            description: Show productVariants considering this offset
            example: 1
      security: []
      responses:
        '200':
          description: ProductVariants successfully returned
          headers:
            X-TotalCount:
              description: Total number of productVariants matching the applied filters
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductVariant'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductVariant'
        '400':
          description: Invalid productId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        'default':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - productVariant
      summary: Add a new productVariant.
      description: Add a new productVariant.
      operationId: addProductVariant
      parameters:
        - name: productId
          in: path
          description: ID of product to return
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Create a new productVariant in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariantInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/ProductVariantInput'
