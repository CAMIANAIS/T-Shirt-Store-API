name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/ci_placeholder
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha || github.event.before }} --to ${{ github.event.pull_request.head.sha || github.sha }} --verbose
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: End-to-end tests
        env:
          # A disposable Postgres for this suite comes from Testcontainers
          # itself (test/setup/global-setup.ts) — DATABASE_URL above is
          # overwritten at runtime, this block never touches it.
          JWT_SECRET: ci-only-placeholder-secret-at-least-32-characters-long
          JWT_EXPIRATION: 3600
          PORT: 3000
          NODE_ENV: test
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          EMAIL_HOST: smtp.ethereal.email
          EMAIL_PORT: 587
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: no-reply@example.com
          AWS_ACCESS_KEY_ID: AKIACIPLACEHOLDERKEY0
          AWS_SECRET_ACCESS_KEY: ci-only-placeholder
          AWS_REGION: us-east-1
          AWS_S3_BUCKET_NAME: ci-placeholder-bucket
          REDIS_URL: redis://localhost:6379
        run: npm run test:e2e
